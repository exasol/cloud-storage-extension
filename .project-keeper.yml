sources:
  - type: maven
    path: pom.xml
    modules:
      - jar_artifact
      - integration_tests
version:
  fromSource: pom.xml
linkReplacements:
build:
  runnerOs: ubuntu-latest
  freeDiskSpace: true
  exasolDbVersions:
    - "2026.1.2"
    - "2025.1.16"
  workflows:
    - name: ci-build.yml
      stepCustomizations:
        - action: INSERT_AFTER
          job: matrix-build
          stepId: enable-testcontainer-reuse
          content:
            name: Fix VM Crash in UDFs
            id: fix-vm-crash
            run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: release.yml
      stepCustomizations:
        - action: REPLACE
          stepId: build
          content:
            name: Build project
            id: build
            # Omit clean: we must not delete the extension built in the previous step.
            run: mvn --batch-mode -DskipTests -DossindexSkip=true verify -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
